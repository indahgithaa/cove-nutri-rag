seed: 42
dev_fraction: 0.20

paths:
  dataset: data/dataset/dataset.json
  chunks_dir: data/chunks
  processed_dir: data/processed

normalization:
  unicode_form: NFKC
  decode_hash_u: true
  remove_codepoints:
    - U+2060

deduplication:
  key:
    - normalized_file
    - exact_trimmed_question
  keep: smallest_original_id

context:
  canonical_source: chunk_corpus
  join_key:
    - normalized_file
    - page_number
    - chunk_index
  retain_dataset_context: true

split:
  unit: document
  algorithm: sorted_documents_then_python_random_shuffle
  dev_fraction: 0.20
  seed: 42

flags:
  has_number_version: numbers_v1.2
  has_number_note: >-
    Validated ordinary-number flag from src/numbers.py. PES spans and configured
    list, page, and section exclusions are masked before extraction.
  has_pes_code_version: numbers_v1.2

